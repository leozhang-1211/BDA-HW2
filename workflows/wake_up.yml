name: Continuous Wake Up
on:
  schedule:
    - cron: '0 0 */2 * *' # 每兩天執行一次，確保不會觸發 7 天休眠
  workflow_dispatch:      # 允許手動執行測試

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Open Streamlit App
        run: |
          # 使用 curl 並模擬常見瀏覽器的 User-Agent
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36" -L https://your-app-url.streamlit.app
