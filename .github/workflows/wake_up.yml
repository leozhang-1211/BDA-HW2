name: Super Wake Up (Playwright)

on:
  schedule:
    - cron: '0 0,12 * * *' # 每 12 小時一次
  workflow_dispatch: 

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Deep Wake Up Streamlit
        run: |
          # 換成你的 App 網址
          APP_URL="https://bda-hw2-bhjphiekbzfmgeu6bnksapp.streamlit.app/"
          
          # 使用 Python 啟動虛擬瀏覽器，進去等 10 秒讓 WebSocket 連線
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print(f'正在造訪 {APP_URL} ...')
              page.goto('$APP_URL', wait_until='networkidle')
              time.sleep(10) # 待久一點，確保後端真的被喚醒
              print('網頁已成功加載，WebSocket 應已連線。')
              browser.close()
          "
