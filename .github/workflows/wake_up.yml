name: Wake up Streamlit App

on:
  schedule:
    # 每 12 小時執行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch: 

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Force Wake Up Streamlit
        run: |
          # 這裡換成你的網址
          APP_URL="https://bda-hw2-bhjphiekbzfmgeu6bnksapp.streamlit.app/"
          
          # --max-redirs 20: 允許更多次的跳轉
          # || true: 這是關鍵！即便 curl 回報錯誤，也會強制讓 GitHub Actions 顯示綠色勾勾
          curl -L --max-redirs 20 -I -s -o /dev/null "$APP_URL" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36" \
          || true
          
          echo "喚醒指令已發送，網站應該正在起床中！"
