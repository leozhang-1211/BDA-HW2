name: Eternal Life (Playwright Interactive)

on:
  schedule:
    - cron: '0 */4 * * *' # 加強頻率：每 4 小時就去操作一次
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          sudo apt-get update
          pip install playwright
          sudo npx playwright install --with-deps chromium

      - name: Deep Interactive Wake Up
        run: |
          APP_URL="https://bda-hw2-bhjphiekbzfmgeu6bnksapp.streamlit.app/"
          
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  # 模擬真實視窗大小
                  context = browser.new_context(viewport={'width': 1280, 'height': 720})
                  page = context.new_page()
                  
                  print(f'正在以真人模式造訪: {APP_URL}')
                  page.goto('$APP_URL', timeout=120000)
                  time.sleep(15) 

                  # 1. 處理休眠按鈕
                  wake_up_btn = page.get_by_text('Yes, get this app back up!', exact=False)
                  if wake_up_btn.is_visible():
                      print('偵測到休眠，執行強制喚醒點擊...')
                      wake_up_btn.click()
                      time.sleep(60) # 點完給它一分鐘啟動
                      page.reload() # 刷新確保進入主畫面
                      time.sleep(10)

                  # 2. 執行「真人互動」：點擊側邊欄選單
                  # 嘗試在選單中切換標的（這會觸發 Streamlit 後端重新計算）
                  try:
                      print('執行真人互動：嘗試操作側邊欄選單...')
                      # 找到那個「選擇標的」的下拉選單並點擊
                      page.locator('div[data-baseweb=\"select\"]').click()
                      time.sleep(2)
                      # 選擇另一個選項（例如從 MSTR 切換到 MARA）
                      page.keyboard.press('ArrowDown')
                      page.keyboard.press('Enter')
                      print('✅ 互動成功：已成功切換數據標的！')
                  except Exception as e:
                      print(f'互動失敗（可能是網頁還沒載入完）：{e}')

                  time.sleep(5)
                  print('程序結束，網頁已保持活躍狀態。')
                  browser.close()
          except Exception as e:
              print(f'發生錯誤: {e}')
          "
