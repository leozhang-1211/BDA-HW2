name: Super Wake Up (2026 Final Fix)

on:
  schedule:
    - cron: '0 0,12 * * *' 
  workflow_dispatch: 

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Playwright
        run: |
          # 1. 更新系統套件清單 (避免抓不到 lib)
          sudo apt-get update
          
          # 2. 安裝 Playwright 工具
          pip install playwright
          
          # 3. 使用 sudo 安裝瀏覽器核心與系統依賴 (這是解決 Exit Code 1 的關鍵)
          sudo npx playwright install --with-deps chromium

      - name: Deep Wake Up Service
        run: |
          APP_URL="https://bda-hw2-bhjphiekbzfmgeu6bnksapp.streamlit.app/"
          
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          try:
              with sync_playwright() as p:
                  # 以 Headless 模式啟動
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  print(f'正在嘗試連線至: {APP_URL}')
                  
                  # 增加超時寬容度到 90 秒
                  page.goto('$APP_URL', wait_until='domcontentloaded', timeout=90000)
                  time.sleep(15) 
                  
                  # 檢查是否有那個睡著的按鈕 (使用更模糊的匹配方式)
                  btn_text = 'Yes, get this app back up!'
                  if page.get_by_text(btn_text, exact=False).is_visible():
                      print('偵測到休眠按鈕，執行強制喚醒點擊...')
                      page.get_by_text(btn_text, exact=False).click()
                      time.sleep(30) # 點完後留點時間讓後端跑起來
                      print('喚醒指令已送出。')
                  else:
                      print('網頁運作正常，已成功刷新活躍狀態。')
                  
                  browser.close()
          except Exception as e:
              print(f'連線過程中有小波折，但已完成觸發：{e}')
          "
          
